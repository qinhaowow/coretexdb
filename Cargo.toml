[package]
name = "coretexdb"
version = "0.2.4"
edition = "2021"
authors = ["qinhaowo <qinhaowo@126.com>"]
description = "CoreTexDB - A multimodal vector database for AI applications, developed with the assistance of the MiMo v2.5 large language model"
license = "AGPL-3.0"
readme = "README.md"
homepage = "https://github.com/qinhaowow/coretexdb"
repository = "https://github.com/qinhaowow/coretexdb"
keywords = ["vector-database", "ai", "embedding", "similarity-search"]
categories = ["database", "science", "machine-learning"]

[workspace]

[lib]
name = "coretexdb"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "coretex"
path = "src/main.rs"

[features]
default = ["tokio", "serde", "compression", "metrics"]
python = ["dep:pyo3", "dep:pyo3-asyncio"]
# `full` 曾包含 `onnx` / `tantivy` / `embedded` / `wasm`，其中 `onnx` 与 `tantivy`
# 的代码**从未通过编译**：
#   * onnx    — `ort = "=2.0.0-rc.12"` 的 API 与代码所用的 `ort::Session` /
#               `SessionInputValue` 不匹配（`cannot find Session in ort`）
#   * tantivy — tantivy 0.22 把多处 API 从 `Option` 改为 `Result`，且
#               `schema::Field` 不再实现 `Default`
#
# 这两个模块（`coretex_tantivy` 296 行、`coretex_embedding` 的 ONNX 引擎）全部
# **零生产调用点**，为它们做 API 迁移等于给死代码做维护，故先移出 `full`，让 CI
# 的 build/test job 真正能跑起来。
#
# `embedded` / `wasm` 曾因同一类原因失败（`coretex_edge` 里 `Result<(), EdgeError>`
# 撞上本 crate 的 `Result<T>` 别名遮蔽），已修好并保留在 `full` 中。
#
# 恢复条件：修好 onnx / tantivy 的 API 兼容后加回。届时 `feature-gate` job 会
# 给出信号（它对这两个 feature 用 `continue-on-error` 记录现状）。
full = ["tokio", "serde", "rocksdb", "compression", "metrics", "tls-gen", "s3", "embedded", "wasm"]
tokio = ["dep:tokio", "dep:tokio-tungstenite"]
serde = ["dep:serde", "dep:serde_json"]
compression = ["dep:flate2", "dep:snap", "dep:lz4_flex", "dep:zstd"]
metrics = ["dep:metrics", "dep:metrics-exporter-prometheus"]
rocksdb = ["dep:rocksdb"]
onnx = ["dep:ort"]
tantivy = ["dep:tantivy"]
# 启用真实自签名证书生成（基于 rcgen）
tls-gen = ["dep:rcgen"]
embedded = []
wasm = []
# S3 / MinIO 存储后端已改为 s3_http::HttpS3Storage（SigV4 over reqwest），
# 无需厂商 SDK，因此无条件编译。此 feature 仅为兼容既有命令行而保留为空。
s3 = []

[dependencies]
# 异步运行时
tokio = { version = "1.0", features = ["full"], optional = true }
async-trait = "0.1"

# Web框架
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-full"] }

# 序列化
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
bincode = "1.3"

# 数据库存储
# 0.20 锁在 librocksdb-sys 0.10（RocksDB 7.9.2），其头文件依赖间接引入
# <cstdint>；GCC 13 收紧传递包含后大量 uint8_t/uint32_t 未声明，编译失败。
# 0.22 对应 RocksDB 8.x，已适配新编译器。
rocksdb = { version = "0.22", features = ["snappy", "lz4", "zstd"], optional = true }

# 向量计算
ndarray = "0.17"
rand = "0.8"
rayon = "1.5"
ordered-float = "4"

# 并发和数据结构
dashmap = "5.0"
crossbeam = "0.8"
parking_lot = "0.12"

# 实用工具
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
log = "0.4"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
lazy_static = "1.4"
regex = "1.5"

# 配置管理
config = "0.13"
toml = "0.7"

# CLI
clap = { version = "4.0", features = ["derive", "env"] }

# 压缩
flate2 = { version = "1.0", optional = true }
snap = { version = "1.0", optional = true }
lz4_flex = { version = "0.11", optional = true }
zstd = { version = "0.13", optional = true }

# 加密
aes-gcm = "0.10"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hmac = "0.12"
base64 = "0.21"
hex = "0.4"
argon2 = "0.5"
rand_core = "0.6"

# B-C-D-D 协议加密
ed25519-dalek = "2.1"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
zeroize = { version = "1.7", features = ["derive"] }

# RPC
reqwest = { version = "0.11", features = ["json"] }

# ONNX推理
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "ndarray"], optional = true }

# 监控指标
metrics = { version = "0.21", optional = true }
metrics-exporter-prometheus = { version = "0.12", optional = true }

# Python绑定
pyo3 = { version = "0.19", features = ["extension-module", "abi3-py38"], optional = true }
# feature 名是 `tokio-runtime`（对应 `pyo3_asyncio::tokio` 模块）。
# 原先写的 "tokio" 不是 pyo3-asyncio 的 feature，被 Cargo 静默忽略，
# 于是 `pyo3_asyncio::tokio` 在 `--features python` 下从不存在，
# 514 行绑定代码一次也没编译过。改为正确的 feature 名。
pyo3-asyncio = { version = "0.19", features = ["tokio-runtime"], optional = true }

# gRPC
tonic = { version = "0.10", features = ["tls", "transport", "gzip"] }
prost = "0.12"

# GraphQL
# 钉到 7.0.13：该版本仍依赖 axum 0.7（7.0.14 起改用 axum 0.8，与项目 axum="0.7" 冲突）
async-graphql = "=7.0.13"
async-graphql-axum = "=7.0.13"
# 同上：derive/parser/value 必须与核心同版。不钉的话会解析到 7.2.1，
# 其宏会生成引用 requires_scopes 字段的代码，
# 而 7.0.13 核心类型无此字段 → 55 个编译错误。
async-graphql-derive = "=7.0.13"
async-graphql-parser = "=7.0.13"
async-graphql-value = "=7.0.13"
async-stream = "0.3"

# 向量索引（使用自定义 HNSWIndex 实现）

# TLS/SSL
rustls = "0.21"
rustls-pemfile = "1.0"
hyper = { version = "0.14", features = ["full"] }
http-body = "0.4"
# 真实自签名证书生成（可选，由 tls-gen feature 启用）
rcgen = { version = "0.11", optional = true }

# CPU Features
cpufeatures = "0.2"

# WebSocket
tokio-tungstenite = { version = "0.21", optional = true }
futures-util = "0.3"
futures = "0.3"

# 全文搜索
tantivy = { version = "0.22", optional = true }

[build-dependencies]
tonic-build = "0.10"

[dev-dependencies]
tempfile = "3.0"
rstest = "0.16"
tokio-test = "0.4"
# `ServiceExt::oneshot` drives axum's Router without binding a socket, so the
# REST integration tests exercise the real routing + middleware stack.
tower = { version = "0.4", features = ["util"] }

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = 'abort'