name: Release

on:
  push:
    branches:
      # The release line. Pushing here builds all five packages and publishes
      # them; the pipeline creates the v<version> tag from the commit that
      # produced the artifacts.
      - 'release/v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Verify before publishing
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
              # Pinned. `stable` on the hosted images moves on the image's schedule,
              # not on ours: ubuntu-24.04 went 1.98.1 -> 1.99.0 on 2026-10-04 with no
              # commit here. The two are not interchangeable — 1.99.0 passes only seven
              # of the fourteen declared features to --check-cfg, so `#[cfg(feature =
              # "embedded")]` and friends start reporting unexpected_cfgs — and a tool
              # that breaks on a day nobody edited the code is not a test result.
              #
              # 1.99.0 specifically: it is what the images ship, so rustup finds it
              # present and downloads nothing. A repository-level rust-toolchain.toml
              # would express the same intent, but it resolves `channel` as an exact
              # toolchain, so any machine without that exact version stops being able
              # to build at all — and it would override this action's RUSTUP_TOOLCHAIN.
              # Pinned here, CI is reproducible and everyone else can still work.
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: verify-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # No librocksdb-dev: librocksdb-sys vendors RocksDB and links it
          # statically, and the default feature set does not include it anyway.
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler
          echo "PROTOC=$(which protoc)" >> $GITHUB_ENV

      # Default features, not `full`. The published binaries are built with
      # `full`, and testing that combination is slow enough to make releases
      # tedious; what this gate is for is stopping a broken library from being
      # packaged, and the default-feature suite is the part that catches that.
      # A failure to compile `full` blocks the release through the build job's
      # `needs` instead.
      - name: Run the test suite
        run: |
          cargo test --lib
          cargo test --test version_consistency
          cargo test --test stats
          cargo test --test replication
          cargo test --test cluster
          cargo test --test snapshot
          cargo test --test pubsub
          cargo test --test fault_injection

  build-release:
    name: Build Release (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Runners are pinned: `ubuntu-latest` migrates to 26.04 between 19 Oct
          # and 19 Nov 2026, `macos-latest` moved to macOS 26 in June, and
          # `windows-latest` moves when Microsoft ships an image. A package
          # whose provenance depends on a label is not reproducible. The
          # probe leg in build.yml is allowed to fail; what gets published is
          # not, so it must not be built on an image still in that state.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            bin_dir: target/x86_64-unknown-linux-gnu/release
            exe_suffix: ''
            cross: 'false'
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            bin_dir: target/aarch64-unknown-linux-gnu/release
            exe_suffix: ''
            cross: 'true'
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            bin_dir: target/x86_64-pc-windows-msvc/release
            exe_suffix: '.exe'
            cross: 'false'
          # macos-15 is arm64; macos-15-intel is the only Intel image GitHub
          # still offers (it retires in August 2027, and macos-13 already did).
          - os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
            bin_dir: target/aarch64-apple-darwin/release
            exe_suffix: ''
            cross: 'false'
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
            bin_dir: target/x86_64-apple-darwin/release
            exe_suffix: ''
            cross: 'false'

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.os }}-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y librocksdb-dev libssl-dev pkg-config protobuf-compiler
          echo "PROTOC=$(which protoc)" >> $GITHUB_ENV
          echo "protoc path: $(which protoc)"

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install rocksdb openssl protobuf
          echo "PROTOC=$(which protoc)" >> $GITHUB_ENV
          echo "protoc path: $(which protoc)"

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $protocVersion = "25.1"
          $protocUrl = "https://github.com/protocolbuffers/protobuf/releases/download/v$protocVersion/protoc-$protocVersion-win64.zip"
          $zipPath = "$env:RUNNER_TEMP\protoc.zip"
          $extractPath = "$env:RUNNER_TEMP\protoc"
          Invoke-WebRequest -Uri $protocUrl -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force
          echo "$extractPath\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Output "PROTOC=$extractPath\bin\protoc.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Activate MSVC (Windows)
        if: runner.os == 'Windows'
        uses: step-security/msvc-dev-cmd@v1
        with:
          arch: x64

      # aarch64-unknown-linux-gnu. Everything else in this file builds for the
      # host; this leg sets up a cross toolchain.
      - name: Set up aarch64 cross toolchain
        if: matrix.cross == 'true'
        shell: bash
        run: |
          # `pipefail` deliberately not set: the reporting below pipes into
          # `head -1`, and when `head` closes the pipe the writer takes SIGPIPE,
          # which `pipefail` turns into exit 141. That would surface as an
          # intermittent "the cross toolchain failed" that says nothing about
          # the toolchain.
          set -eu
          sudo apt-get update
          # No librocksdb-dev:arm64 — librocksdb-sys compiles its vendored copy.
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross

          # Resolve libclang first and fail here if it is missing, rather than
          # exporting a path built from an empty `ls` and letting bindgen fail
          # later with a message about something else entirely.
          LIBCLANG="$(find /usr/lib/llvm-*/lib -maxdepth 1 -name 'libclang.so*' 2>/dev/null | head -1)"
          if [ -z "$LIBCLANG" ]; then
            echo "no libclang under /usr/lib/llvm-*/lib — librocksdb-sys runs bindgen and needs it" >&2
            echo "looked for libclang.so* in:" >&2
            ls -d /usr/lib/llvm-* 2>/dev/null >&2 || echo "  (no llvm directories at all)" >&2
            exit 1
          fi
          LIBCLANG_DIR="$(dirname "$LIBCLANG")"

          # Written to $GITHUB_ENV for the *following* steps; the values are
          # also kept locally so this step can report what it set. Reading them
          # back out of the environment instead is what the previous version
          # did, and `set -u` turned the summary line into the build's failure.
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            # `cc` picks these up per target; RocksDB, zstd-sys and lz4-sys all
            # build through it, and the C++ ones need the cross g++.
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++"
            echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar"
            echo "RANLIB_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ranlib"
            echo "LIBCLANG_PATH=$LIBCLANG_DIR"
          } >> "$GITHUB_ENV"

          # Diagnostics only: a toolchain that declines to print its sysroot
          # should not stop the release.
          echo "aarch64-linux-gnu-gcc: $(aarch64-linux-gnu-gcc --version 2>&1 | head -1 || echo unknown)"
          echo "aarch64-linux-gnu-g++: $(aarch64-linux-gnu-g++ --version 2>&1 | head -1 || echo unknown)"
          echo "libclang: $LIBCLANG"
          echo "LIBCLANG_PATH=$LIBCLANG_DIR"
          echo "sysroot: $(aarch64-linux-gnu-gcc -print-sysroot 2>/dev/null || echo unknown)"
          echo "multiarch: $(aarch64-linux-gnu-gcc -print-multiarch 2>/dev/null || echo unknown)"

      - name: Resolve version
        id: ver
        shell: bash
        # `cut` rather than a `sed` regex: Cargo.toml is checked out with CRLF
        # line endings, so a `$` anchor never matches and the version comes out
        # empty — which silently produced `CoreTexDB-V-<target>`.
        run: echo "v=$(grep -m1 '^version = ' Cargo.toml | cut -d'\"' -f2)" >> "$GITHUB_OUTPUT"

      # `--features full`, the same combination build.yml compiles and tests.
      # Publishing anything else means shipping binaries no test run ever
      # exercised.
      - name: Build release binaries and libraries
        run: cargo build --release --lib --bins --features full --target ${{ matrix.target }}

      - name: Stage package (Unix)
        if: runner.os != 'Windows'
        run: |
          STAGE=CoreTexDB-V${{ steps.ver.outputs.v }}-${{ matrix.target }}
          BD="${{ matrix.bin_dir }}"
          mkdir -p "$STAGE"/{bin,lib,include,config,share,scripts,systemd,logrotate}
          mkdir -p "$STAGE"/data/coretex/{collections,indexes/{vector,scalar},metadata,store}
          mkdir -p "$STAGE"/data/{wal,backup/{full,incremental,snapshots},logs/audit,temp,versions}
          for b in coretex; do
            install -m 755 "$BD/$b" "$STAGE/bin/$b"
          done
          for lib in libcoretexdb.so libcoretexdb.dylib libcoretexdb.a; do
            [ -f "$BD/$lib" ] && install -m 755 "$BD/$lib" "$STAGE/lib/$lib" || true
          done
          cp VERSION RELEASE_NOTES.md LICENSE README.md "$STAGE/" 2>/dev/null || true
          cp -a config/. "$STAGE/config/"
          cp -a scripts/. "$STAGE/scripts/"
          cp -a systemd/. "$STAGE/systemd/"
          cp -a logrotate/. "$STAGE/logrotate/"
          cp -a share/. "$STAGE/share/"
          cp -a include/. "$STAGE/include/"
          ln -sfn ../include/coretexdb.h "$STAGE/lib/coretexdb.h"
          chmod 755 "$STAGE/scripts/"*.sh 2>/dev/null || true
          find "$STAGE/data" -type d -exec chmod 750 {} +
          tar -czvf "${STAGE}.tar.gz" "$STAGE"
          echo "ASSET=${STAGE}.tar.gz" >> $GITHUB_ENV
          echo "ASSET_NAME=${STAGE}.tar.gz" >> $GITHUB_ENV

      - name: Stage package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "CoreTexDB-V${{ steps.ver.outputs.v }}-${{ matrix.target }}"
          $bd = "${{ matrix.bin_dir }}"
          $bins = @('coretex')
          New-Item -ItemType Directory -Path "$stage\bin","$stage\lib","$stage\include","$stage\config","$stage\share","$stage\scripts","$stage\systemd","$stage\logrotate" -Force | Out-Null
          $dataDirs = @(
            'data\coretex\collections','data\coretex\indexes\vector','data\coretex\indexes\scalar',
            'data\coretex\metadata','data\coretex\store',
            'data\wal','data\backup\full','data\backup\incremental','data\backup\snapshots',
            'data\logs\audit','data\temp','data\versions'
          )
          foreach ($d in $dataDirs) { New-Item -ItemType Directory -Path (Join-Path $stage $d) -Force | Out-Null }
          foreach ($b in $bins) {
            Copy-Item "$bd\$b.exe" "$stage\bin\$b.exe" -Force
          }
          foreach ($lib in @('coretexdb.dll','coretexdb.lib','libcoretexdb.a')) {
            if (Test-Path "$bd\$lib") { Copy-Item "$bd\$lib" "$stage\lib\$lib" -Force }
            if (Test-Path $lib) { Copy-Item $lib "$stage\lib\$lib" -Force }
          }
          foreach ($f in @('VERSION','RELEASE_NOTES.md','LICENSE','README.md')) {
            if (Test-Path $f) { Copy-Item $f "$stage\$f" -Force }
          }
          foreach ($d in @('config','scripts','systemd','logrotate','include','share')) {
            Copy-Item $d "$stage\$d" -Recurse -Force
          }
          if (Test-Path "$stage\include\coretexdb.h") {
            Copy-Item "$stage\include\coretexdb.h" "$stage\lib\coretexdb.h" -Force
          }
          Get-ChildItem "$stage\scripts\*.sh" -ErrorAction SilentlyContinue | ForEach-Object { $_.Attributes = $_.Attributes -bor [IO.FileAttributes]::Normal }
          Compress-Archive -Path $stage -DestinationPath "$stage.zip" -Force
          "ASSET=$stage.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ASSET_NAME=$stage.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: SHA256 checksum
        shell: bash
        run: |
          # An absent $ASSET used to skip this step in silence, so a release
          # could publish an archive with no checksum beside it.
          [ -n "${ASSET:-}" ] || { echo "ASSET is empty — staging failed"; exit 1; }
          [ -f "$ASSET" ] || { echo "no such file: $ASSET"; exit 1; }
          sha256sum "$ASSET" | tee "${ASSET}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.ASSET_NAME }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET_NAME }}.sha256

  build-python:
    name: Build Python distributions
    needs: verify
    # Pinned deliberately. GitHub moves `ubuntu-latest` from 24.04 to 26.04
    # between 19 Oct and 19 Nov 2026, and during that rollout two runs of this
    # workflow can land on different images. 26.04 bumps system Python to
    # 3.14, Node to 24, Java to 25 and CMake to 4.x, and drops several
    # preinstalled tools — none of which this project uses, because Rust comes
    # from rust-toolchain and Python from setup-python with an explicit
    # version. The C library surface looked like the exposure, since
    # librocksdb-sys is a C++ dependency — but it vendors RocksDB and links it
    # statically, so the distribution's version never enters into it.
    # To move deliberately: run the 26.04 leg below until it is green, then
    # change these labels back to `ubuntu-26.04`.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine setuptools wheel grpcio-tools protobuf

      # The generated stubs are inputs to the package, not build artefacts: the
      # wheel has to ship them, so they are produced before packaging rather
      # than left for a consumer to run protoc themselves.
      - name: Generate protobuf Python code
        run: |
          python -m grpc_tools.protoc -I./src/coretex_grpc \
            --python_out=./python/coretexdb --grpc_python_out=./python/coretexdb \
            ./src/coretex_grpc/coretex.proto

      - name: Fix protobuf imports
        working-directory: python/coretexdb
        run: |
          if [ -f coretex_pb2_grpc.py ]; then
            # protoc emits an absolute import; inside a package it must be
            # relative, or the wheel installs something that cannot import.
            # The names come from `coretex.proto`.
            sed -i 's/^import coretex_pb2 as /from . import coretex_pb2 as /' coretex_pb2_grpc.py
            ls -la coretex_pb2*.py
          else
            echo "coretex_pb2.py was not generated — the package would ship without it"
            exit 1
          fi

      - name: Build sdist and wheel
        working-directory: python
        run: |
          python -m build
          ls -la dist/

      # `twine check` renders the metadata the way a repository index would, so
      # a malformed description or a missing long_description fails here rather
      # than after the release is published.
      - name: Verify distributions
        working-directory: python
        run: |
          twine check dist/*
          python -m zipfile -l dist/*.whl | head -20

      - name: Install the wheel and import it
        working-directory: python
        run: |
          pip install dist/*.whl
          python -c "import coretexdb; print('wheel installs and imports:', coretexdb.__version__)"

      - name: Upload distributions
        uses: actions/upload-artifact@v6
        with:
          name: python-dist
          path: python/dist/*
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: [build-release, build-python]
    # Pinned deliberately. GitHub moves `ubuntu-latest` from 24.04 to 26.04
    # between 19 Oct and 19 Nov 2026, and during that rollout two runs of this
    # workflow can land on different images. 26.04 bumps system Python to
    # 3.14, Node to 24, Java to 25 and CMake to 4.x, and drops several
    # preinstalled tools — none of which this project uses, because Rust comes
    # from rust-toolchain and Python from setup-python with an explicit
    # version. The C library surface looked like the exposure, but
    # librocksdb-sys vendors its RocksDB and links it statically, so whatever
    # version the distribution ships never enters into it.
    # To move deliberately: run the 26.04 leg below until it is green, then
    # change these labels back to `ubuntu-26.04`.
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Resolve version
        id: ver
        shell: bash
        # `cut` rather than a `sed` regex: Cargo.toml is checked out with CRLF
        # line endings, where a `$` anchor never matches and the version comes
        # out empty.
        run: echo "v=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          # The pipeline creates the tag, so it has to be told which one. The
          # tag names the commit the artifacts were actually built from rather
          # than a name someone typed earlier.
          tag_name: v${{ steps.ver.outputs.v }}
          commitish: ${{ github.sha }}
          # Pre-release is a property of the version, not of the trigger. A
          # `refs/heads/...` ref made the old `!startsWith(... 'tags/v')`
          # expression permanently true, which would have published every
          # branch release as a pre-release.
          prerelease: ${{ contains(steps.ver.outputs.v, '-') }}
          generate_release_notes: true
          files: artifacts/**/*
          body: |
            CoreTexDB V${{ steps.ver.outputs.v }} — full install-root packages.

            | Platform | Target |
            |---|---|
            | Linux x86_64 | `x86_64-unknown-linux-gnu` |
            | Linux ARM64 | `aarch64-unknown-linux-gnu` (cross-compiled) |
            | Windows x86_64 | `x86_64-pc-windows-msvc` |
            | macOS Apple Silicon | `aarch64-apple-darwin` |
            | macOS Intel | `x86_64-apple-darwin` |

            Each archive contains:
            - `bin/` coretex (single entrypoint: server / backup / restore / doctor / dump)
            - `lib/` libcoretexdb / coretexdb (when produced by the toolchain)
            - `include/` coretexdb.h
            - `config/` `scripts/` `systemd/` `logrotate/` `share/`
            - `data/` skeleton: coretex/{collections,indexes,metadata,store}, wal, backup, logs, temp, versions
            - VERSION, README, LICENSE, RELEASE_NOTES

            Built with `--features full` — the same combination CI compiles and
            tests, so the binaries here are the ones those runs exercised.

            Also attached: `coretexdb` Python SDK `sdist` and `wheel` (a
            separate version line; see `python/README.md`).

            Verify every archive with its `*.sha256`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
