name: Build

on:
  push:
    branches: [ master, release/* ]
  pull_request:
    branches: [ master, release/* ]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `ubuntu-latest` migrates to 26.04 between 19 Oct and 19 Nov 2026, so
        # it runs here to surface the incompatibilities on a branch, on our
        # schedule. Nothing depends on this leg: a red 26.04 does not fail the
        # workflow, which is what makes it safe to leave in place.
        os: [ubuntu-24.04, ubuntu-26.04, windows-latest, macos-latest]

    # `--features full` pulls in librocksdb-sys, which vendors and statically
    # links ~700 C++ files, so this leg is where a toolchain or header move
    # would show up first. Read the log before calling the leg merely flaky.
    continue-on-error: ${{ matrix.os == 'ubuntu-26.04' }}

    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache cargo registry
      uses: actions/cache@v6
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-${{ matrix.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v6
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-${{ matrix.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v6
      with:
        path: target
        key: ${{ runner.os }}-${{ matrix.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Install system dependencies (Linux)
      # Keyed on the runner, not the matrix label: the label is a moving target
      # and a guard written against it turns "the label moved" into "the
      # dependencies silently stopped being installed".
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y librocksdb-dev libssl-dev pkg-config protobuf-compiler
        echo "PROTOC=$(which protoc)" >> $GITHUB_ENV
        echo "protoc path: $(which protoc)"
        # The probe leg exists precisely because these can change under us, so
        # record them where a failure can be read back from the log.
        echo "image: $(. /etc/os-release && echo "$PRETTY_NAME")"
        echo "rocksdb: $(dpkg-query -W -f='${Version}' librocksdb-dev 2>/dev/null || echo absent)"
        echo "openssl: $(dpkg-query -W -f='${Version}' libssl-dev 2>/dev/null || echo absent)"
        echo "protoc: $(protoc --version 2>/dev/null || echo absent)"

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install rocksdb openssl protobuf
        # 确保 protoc 在 PATH 中
        echo "PROTOC=$(which protoc)" >> $GITHUB_ENV
        echo "protoc path: $(which protoc)"

    - name: Install protoc (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $protocVersion = "25.1"
        $protocUrl = "https://github.com/protocolbuffers/protobuf/releases/download/v$protocVersion/protoc-$protocVersion-win64.zip"
        $zipPath = "$env:RUNNER_TEMP\protoc.zip"
        $extractPath = "$env:RUNNER_TEMP\protoc"
        Write-Output "Downloading protoc from $protocUrl"
        Invoke-WebRequest -Uri $protocUrl -OutFile $zipPath
        Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force
        echo "$extractPath\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        Write-Output "PROTOC=$extractPath\bin\protoc.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        Write-Output "protoc installed successfully"

    # `ilammy/msvc-dev-cmd` is abandoned and still declares node20, with no v2
    # and the Node 24 PRs unmerged; step-security's is the maintained drop-in
    # and takes the same inputs.
    - name: Activate MSVC toolchain (Windows)
      if: runner.os == 'Windows'
      uses: step-security/msvc-dev-cmd@v1
      with:
        arch: x64

    # Reports which toolchain is actually present instead of demanding a year.
    # Hosted runners ship whichever Visual Studio is current, so the old
    # `-version "[2026.0,2027.0)"` query returned an empty string and the step
    # passed without having checked anything — a build that later failed in
    # `cc` would have had no clue why.
    - name: Report MSVC toolchain (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $cl = Get-Command cl.exe -ErrorAction SilentlyContinue
        if (-not $cl) {
          Write-Error "cl.exe is not on PATH after activating the MSVC environment"
          exit 1
        }
        Write-Output "cl.exe: $($cl.Source)"
        Write-Output "Version: $((& cl.exe) 2>&1 | Select-String -Pattern 'Microsoft.*Compiler' | Select-Object -First 1)"

        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        if (Test-Path $vswhere) {
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $install) {
            Write-Error "vswhere found no Visual Studio with the C++ toolset"
            exit 1
          }
          Write-Output "VS install path: $install"
          Write-Output "VS version: $(& $vswhere -latest -products * -property displayName)"
        } else {
          Write-Warning "vswhere not found; skipping the Visual Studio inventory"
        }

    - name: Install libclang (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        pip install libclang
        $libclangDll = Get-ChildItem -Path "$env:USERPROFILE\AppData\Roaming\Python\Python311\site-packages\clang\native" -Filter "libclang.dll" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        if (-not $libclangDll) {
          $libclangDll = Get-ChildItem -Path "$env:RUNNER_TEMP" -Filter "libclang.dll" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        }
        if (-not $libclangDll) {
          $libclangDll = Get-ChildItem -Path "$env:USERPROFILE\AppData\Local\pip" -Filter "libclang.dll" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        }
        if ($libclangDll) {
          $libclangDir = $libclangDll.Directory.FullName
          Write-Output "LIBCLANG_PATH=$libclangDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "libclang found at: $libclangDir"
        } else {
          Write-Output "libclang.dll not found via search, will rely on PATH"
        }

    - name: Build release
      run: cargo build --release --features full --verbose

    - name: Run tests
      run: cargo test --features full --verbose

  # `full` 是 default 的超集，但两者都编译的是同一批 cfg 分支吗？不是：
  # `#[cfg(not(feature = "tls-gen"))]` 这类对偶分支只在 default 下存在，
  # `#[cfg(not(feature = "compression"))]` 同理。CONTRIBUTING §2 要求
  # `cargo test`（default）与 `cargo test --features full` 都全绿，
  # 但此前 CI 只有 full 一条路径，导致 default 专属的测试从未在 CI 执行过
  # （例如 coretex_security_tests.rs 的 test_tls_self_signed_cert_disabled）。
  test-default:
    name: Test (default features)
    # Pinned deliberately. GitHub moves `ubuntu-latest` from 24.04 to 26.04
    # between 19 Oct and 19 Nov 2026, and during that rollout two runs of this
    # workflow can land on different images. 26.04 bumps system Python to
    # 3.14, Node to 24, Java to 25 and CMake to 4.x, and drops several
    # preinstalled tools — none of which this project uses, because Rust comes
    # from rust-toolchain and Python from setup-python with an explicit
    # version. The C library surface looked like the exposure, but
    # librocksdb-sys vendors its RocksDB and links it statically, so whatever
    # version the distribution ships never enters into it.
    # To move deliberately: run the 26.04 leg below until it is green, then
    # change these labels back to `ubuntu-26.04`.
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry
      uses: actions/cache@v6
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Install system dependencies (Ubuntu)
      run: |
        sudo apt-get update
        sudo apt-get install -y libssl-dev pkg-config protobuf-compiler
        echo "PROTOC=$(which protoc)" >> $GITHUB_ENV

    - name: cargo test (default features)
      run: cargo test --verbose

  # 每个 feature 单独编译，任何一个腐化都会被立刻定位到具体 feature。
  #
  # 之前不存在这道门禁：`cargo test --features full` 因 s3 编译失败而从未执行，
  # 于是 onnx / tantivy / embedded / wasm 四个 feature 下的代码可以任意腐化而
  # 无人察觉（`full` 里已把它们移出，见 Cargo.toml 的说明；本 job 是它们日后
  # 回归时的第一道信号）。
  feature-gate:
    name: Feature gate (each feature must compile)
    # Pinned deliberately. GitHub moves `ubuntu-latest` from 24.04 to 26.04
    # between 19 Oct and 19 Nov 2026, and during that rollout two runs of this
    # workflow can land on different images. 26.04 bumps system Python to
    # 3.14, Node to 24, Java to 25 and CMake to 4.x, and drops several
    # preinstalled tools — none of which this project uses, because Rust comes
    # from rust-toolchain and Python from setup-python with an explicit
    # version. The C library surface looked like the exposure, but
    # librocksdb-sys vendors its RocksDB and links it statically, so whatever
    # version the distribution ships never enters into it.
    # To move deliberately: run the 26.04 leg below until it is green, then
    # change these labels back to `ubuntu-26.04`.
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry
      uses: actions/cache@v6
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Install system dependencies (Ubuntu)
      run: |
        sudo apt-get update
        sudo apt-get install -y librocksdb-dev libssl-dev pkg-config protobuf-compiler
        echo "PROTOC=$(which protoc)" >> $GITHUB_ENV

    # 已移出 `full` 的两个 feature：编译必然失败，这里先记录现状而不是掩盖。
    # 修好 API 兼容后，把对应条目从这里移除、加入上面 active 列表，门禁即自动生效。
    #
    # （`embedded` / `wasm` 曾因 `coretex_edge` 里 `Result<(), EdgeError>` 撞上本 crate
    # 的 `Result<T>` 别名遮蔽而失败，已修好并移入上面的 active 列表。）
    #
    # 必须叠加在 default features 之上：`tokio` / `serde` 虽在 features 表里声明为
    # optional，但 `lib.rs` 无条件 `use` 它们（源码里没有对应的 `#[cfg]`），所以任何
    # `--no-default-features` 组合都会先死于 `cannot find module or crate tokio`，
    # 而非我们真正关心的 API 不兼容 —— 那样记录到的是误导性信息。
    - name: Compile disabled features (known-broken, informational)
      continue-on-error: true
      run: |
        set -u
        for feat in onnx tantivy; do
          echo "=== feature: $feat ==="
          cargo check --features "$feat" --lib 2>&1 | tail -8
        done

    - name: Compile active features individually
      run: |
        set -euo pipefail
        for feat in tokio serde compression metrics rocksdb tls-gen s3 embedded wasm python; do
          echo "=== feature: $feat ==="
          cargo check --features "$feat" --lib
        done

    # `full` 是发布产物使用的组合，必须始终能编译 + 跑测试。
    - name: Compile full
      run: cargo check --features full --all-targets

  build-python:
    name: Build Python Package
    # Pinned deliberately. GitHub moves `ubuntu-latest` from 24.04 to 26.04
    # between 19 Oct and 19 Nov 2026, and during that rollout two runs of this
    # workflow can land on different images. 26.04 bumps system Python to
    # 3.14, Node to 24, Java to 25 and CMake to 4.x, and drops several
    # preinstalled tools — none of which this project uses, because Rust comes
    # from rust-toolchain and Python from setup-python with an explicit
    # version. The C library surface looked like the exposure, but
    # librocksdb-sys vendors its RocksDB and links it statically, so whatever
    # version the distribution ships never enters into it.
    # To move deliberately: run the 26.04 leg below until it is green, then
    # change these labels back to `ubuntu-26.04`.
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7
      with:
        path: repo

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Clean pip cache completely
      run: |
        pip cache purge || true
        rm -rf ~/.cache/pip || true

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine setuptools wheel numpy pandas pydantic requests aiohttp grpcio grpcio-tools protobuf

    - name: Generate protobuf Python code
      run: |
        cd repo
        # Into the package, not beside it. A wheel carries only `coretexdb*`,
        # so stubs left in python/ are dropped: the SDK then imports, reports
        # protobuf as unavailable, and raises on the first gRPC call.
        python -m grpc_tools.protoc -I./src/coretex_grpc \
          --python_out=./python/coretexdb --grpc_python_out=./python/coretexdb \
          ./src/coretex_grpc/coretex.proto
        ls -la python/coretexdb/*pb2*

    - name: Fix protobuf imports
      working-directory: repo/python/coretexdb
      run: |
        if [ -f coretex_pb2_grpc.py ]; then
          # protoc emits `import coretex_pb2 as coretex__pb2` — an absolute
          # import that resolves only with python/ on sys.path. Inside an
          # installed package it has to be relative.
          #
          # The names follow `coretex.proto`, and the step used to look for
          # `coretexdb_pb2_grpc.py`, which no generator produces: it found
          # nothing, warned, and carried on. `grpc_client` had the same
          # mismatch, so gRPC was reported unavailable in every install.
          sed -i 's/^import coretex_pb2 as /from . import coretex_pb2 as /' coretex_pb2_grpc.py
          grep -n 'coretex_pb2' coretex_pb2_grpc.py | head -3
        else
          # Previously a warning: the job went on to install a package with no
          # stubs, which imports fine and fails at first use.
          echo "error: coretex_pb2.py was not generated"
          ls -la
          exit 1
        fi

    # `pip install -e .` proved the tree was importable from the checkout, which
    # says nothing about whether it can be packaged or installed from a wheel.
    # Both are exercised here, and the generated stubs are required rather than
    # assumed: the wheel ships them, so a protoc run that silently produced
    # nothing would yield a package that imports and then fails on first use.
    - name: Build sdist and wheel
      working-directory: repo/python
      run: |
        rm -rf dist build *.egg-info
        python -m build
        ls -la dist/

    - name: Verify distributions
      working-directory: repo/python
      run: |
        twine check dist/*
        test -f dist/*.whl || { echo "no wheel produced"; exit 1; }
        test -f dist/*.tar.gz || { echo "no sdist produced"; exit 1; }
        python -m zipfile -l dist/*.whl | grep -E 'coretex_pb2|coretexdb/version' || {
          echo "the wheel is missing the generated stubs or the version module"; exit 1; }

    - name: Install the wheel and import it
      working-directory: repo/python
      run: |
        pip install dist/*.whl
        python -c "import coretexdb; print('wheel installs and imports:', coretexdb.__version__)"

  examples:
    # examples/ 是对外可运行的示例，必须一直能编译、能跑通，否则文档就是假的。
    name: Examples
    # Pinned deliberately. GitHub moves `ubuntu-latest` from 24.04 to 26.04
    # between 19 Oct and 19 Nov 2026, and during that rollout two runs of this
    # workflow can land on different images. 26.04 bumps system Python to
    # 3.14, Node to 24, Java to 25 and CMake to 4.x, and drops several
    # preinstalled tools — none of which this project uses, because Rust comes
    # from rust-toolchain and Python from setup-python with an explicit
    # version. The C library surface looked like the exposure, but
    # librocksdb-sys vendors its RocksDB and links it statically, so whatever
    # version the distribution ships never enters into it.
    # To move deliberately: run the 26.04 leg below until it is green, then
    # change these labels back to `ubuntu-26.04`.
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry
      uses: actions/cache@v6
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Install system dependencies (Ubuntu)
      run: |
        sudo apt-get update
        sudo apt-get install -y librocksdb-dev libssl-dev pkg-config protobuf-compiler
        echo "PROTOC=$(which protoc)" >> $GITHUB_ENV

    - name: Build examples
      run: cargo build --examples

    - name: Run examples
      run: |
        # `mvp` 是最小可运行链路的可执行定义：每一步都带断言，任何回归都会让 CI 变红。
        cargo run -q --example mvp
        cargo run -q --example quickstart
        cargo run -q --example filter_search
        cargo run -q --example persistence

    - name: Build rustdoc
      run: cargo doc --no-deps

  lint:
    # 只 gate「deny 级」clippy lint（恒真比较、恒不循环的死循环、坏的 rustdoc 链接等）
    # 与 rustdoc 能否构建；普通 warning 暂不卡，见 docs/roadmap.md D5。
    name: Lint
    # Pinned deliberately. GitHub moves `ubuntu-latest` from 24.04 to 26.04
    # between 19 Oct and 19 Nov 2026, and during that rollout two runs of this
    # workflow can land on different images. 26.04 bumps system Python to
    # 3.14, Node to 24, Java to 25 and CMake to 4.x, and drops several
    # preinstalled tools — none of which this project uses, because Rust comes
    # from rust-toolchain and Python from setup-python with an explicit
    # version. The C library surface looked like the exposure, but
    # librocksdb-sys vendors its RocksDB and links it statically, so whatever
    # version the distribution ships never enters into it.
    # To move deliberately: run the 26.04 leg below until it is green, then
    # change these labels back to `ubuntu-26.04`.
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Cache cargo registry
      uses: actions/cache@v6
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Install system dependencies (Ubuntu)
      run: |
        sudo apt-get update
        sudo apt-get install -y librocksdb-dev libssl-dev pkg-config protobuf-compiler
        echo "PROTOC=$(which protoc)" >> $GITHUB_ENV

    - name: clippy (deny-level only)
      run: cargo clippy --all-targets

    - name: rustdoc
      run: cargo doc --no-deps

