name: Feature request
description: 提议一个新功能或改进 / Propose a feature or improvement
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        大改动请先讨论再动手，避免重复劳动。路线图见
        [`docs/roadmap.md`](../../docs/roadmap.md)。
        Please discuss large changes first — see docs/roadmap.md.
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem
      description: 什么场景下现在做不到/做不好？越具体越好。
      placeholder: "集合有 500 万条向量时，带过滤条件的查询会退化为全量精算。"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案 / Proposed solution
      description: 你希望的接口、命令或行为（如有示例请附上）。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 曾考虑的替代方案 / Alternatives considered
  - type: textarea
    id: context
    attributes:
      label: 补充 context / Additional context
      description: 相关项目（Qdrant、Weaviate、Milvus…）的做法、参考链接、性能预期。
  - type: dropdown
    id: area
    attributes:
      label: 涉及模块 / Area
      options:
        - 存储 / storage
        - 数据与恢复 / data
        - 索引与性能 / index & performance
        - REST / GraphQL / WebSocket
        - gRPC / FFI
        - CLI
        - 复制、集群与高可用
        - 可观测性 / observability
        - 文档与示例 / docs & examples
        - 其他 / other
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: 参与方式 / Contribution
      options:
        - label: 我愿意实现这个功能并补测试
        - label: 我只需要讨论，暂时不参与实现
