on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-gnu
  PROJECT_NAME: coretex
  VERSION: ${{ github.ref_name }}

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            librocksdb-dev \
            libssl-dev \
            pkg-config \
            protobuf-compiler
            
      - name: Build
        run: cargo build --release --features full --target ${{ matrix.target }}
        
      - name: Test
        run: cargo test --release --target ${{ matrix.target }}
        
      - name: Create archive
        run: |
          tar -czvf ${{ env.PROJECT_NAME }}-${{ env.VERSION }}-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release \
            ${{ env.PROJECT_NAME }}
            
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-${{ env.VERSION }}-${{ matrix.target }}
          path: ${{ env.PROJECT_NAME }}-${{ env.VERSION }}-${{ matrix.target }}.tar.gz
          retention-days: 30