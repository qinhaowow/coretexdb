[source.crates-io]
replace-with = "tuna"

[source.tuna]
registry = "sparse+https://mirrors.tuna.tsinghua.edu.cn/crates.io-index/"

[env]
RUSTFLAGS = "--cap-lints warn"

# ── Windows 交叉编译（GNU ABI）────────────────────────────────
# Linux 上无法构建 x86_64-pc-windows-msvc：那需要微软的 link.exe，
# 只在 Windows 的 Visual Studio 里存在。GNU ABI 用 mingw-w64 即可。
# 依赖：sudo apt install gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
# 构建：cargo build --release --target x86_64-pc-windows-gnu
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
ar = "x86_64-w64-mingw32-ar"
